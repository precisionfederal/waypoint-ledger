name = "YOUR-PAGES-PROJECT"        # wrangler pages project create YOUR-PAGES-PROJECT
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

[[kv_namespaces]]
binding = "LEDGER"
id = "YOUR_KV_NAMESPACE_ID"        # wrangler kv namespace create LEDGER

[[d1_databases]]
binding = "DB"
database_name = "YOUR-PAGES-PROJECT"        # wrangler pages project create YOUR-PAGES-PROJECT
database_id = "YOUR_D1_DATABASE_ID"   # wrangler d1 create waypoint-ledger
migrations_dir = "migrations"

[ai]
binding = "AI"
